; Giới hạn tải lên phải KHỚP BACKUP_MAX_UPLOAD_MB (mặc định 512 MB) của chức năng Import sao lưu;
; nginx (docker/nginx/default.conf: client_max_body_size) cũng phải cho phép chừng đó.
upload_max_filesize = 520M
post_max_size = 530M
; Import giải mã và kiểm tra cả file trước khi nhận, có thể lâu hơn mặc định 30 giây của PHP-FPM.
max_execution_time = 300
