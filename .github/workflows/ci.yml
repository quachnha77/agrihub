name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Tài khoản quản trị của container (superuser => bỏ qua RLS) CHỈ dùng để tạo role ứng dụng bên dưới.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: agrihub_test
      DB_USERNAME: agrihub
      DB_PASSWORD: ci_only_password
      # Tài khoản sao lưu RIÊNG (BYPASSRLS + CREATEDB, không phải superuser) để kiểm thử sao lưu toàn hệ thống bằng pg_dump.
      BACKUP_DB_USERNAME: agrihub_backup
      BACKUP_DB_PASSWORD: ci_backup_password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, bcmath, zip, sodium, zlib
          coverage: none
      - name: Tạo role ứng dụng KHÔNG phải superuser (để Row-Level Security có hiệu lực)
        working-directory: .
        env:
          PGPASSWORD: ci_admin_password
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE agrihub LOGIN PASSWORD 'ci_only_password' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE DATABASE agrihub_test OWNER agrihub" \
            -c "CREATE ROLE agrihub_backup LOGIN PASSWORD 'ci_backup_password' NOSUPERUSER CREATEDB BYPASSRLS" \
            -c "GRANT pg_read_all_data TO agrihub_backup" \
            -c "GRANT agrihub TO agrihub_backup"
      - name: Dùng pg_dump / pg_restore ĐÚNG phiên bản máy chủ (lấy từ chính image postgres:16-alpine)
        # Client của runner (ubuntu-latest) đổi phiên bản theo bản Ubuntu và pg_dump mới hơn máy chủ tạo ra bản dump mà máy chủ cũ
        # không nạp được. Hai script nhỏ chạy công cụ trong container cùng image với service postgres (mạng host => 127.0.0.1:5432).
        working-directory: .
        run: |
          bin="$RUNNER_TEMP/pgbin"
          mkdir -p "$bin"
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host -e PGPASSWORD -e PGCONNECT_TIMEOUT -e PGSSLMODE postgres:16-alpine %s "$@"\n' "$tool" > "$bin/$tool"
            chmod +x "$bin/$tool"
          done
          echo "BACKUP_PG_BIN=$bin" >> "$GITHUB_ENV"
          "$bin/pg_dump" --version
          "$bin/pg_restore" --version
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test

  # Máy dev của dự án KHÔNG chạy được Docker (BIOS tắt ảo hóa), nên CI là nơi kiểm chứng cấu hình Docker thật:
  # build image, khởi tạo database bằng đúng script init, migrate, sao lưu pg_dump + khôi phục thử TRONG container.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Chuẩn bị .env cho backend (thư mục backend được mount vào container)
        run: cp backend/.env.example backend/.env
      - name: Build image
        run: docker compose build app queue scheduler
      - name: Cài thư viện PHP và tạo APP_KEY (trong container)
        run: docker compose run --rm --no-deps app sh -c "composer install --no-interaction --prefer-dist --no-progress && php artisan key:generate"
      - name: Khởi động PostgreSQL và Redis
        run: docker compose up -d --wait postgres redis
      - name: Role database đúng thiết kế (ứng dụng KHÔNG được bỏ qua RLS; tài khoản sao lưu có BYPASSRLS + CREATEDB)
        run: |
          rows=$(docker compose exec -T postgres psql -U postgres -tA -F, -c "select rolname,rolsuper,rolbypassrls,rolcreatedb from pg_roles where rolname in ('agrihub','agrihub_backup') order by 1")
          echo "$rows"
          echo "$rows" | grep -qx 'agrihub,f,f,f'
          echo "$rows" | grep -qx 'agrihub_backup,f,t,t'
      - name: Migrate
        run: docker compose run --rm app php artisan migrate --force
      - name: Khởi động web, queue worker và scheduler
        run: docker compose up -d --wait nginx app queue scheduler
      - name: API sẵn sàng
        run: curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://localhost:8000/api/v1/health/ready
      - name: Giới hạn tải lên khớp chức năng Import 512 MB
        run: |
          out=$(docker compose exec -T app php -r 'foreach (["upload_max_filesize","post_max_size","max_execution_time"] as $k) echo $k,"=",ini_get($k),"\n";')
          echo "$out"
          echo "$out" | grep -qx 'upload_max_filesize=520M'
          echo "$out" | grep -qx 'post_max_size=530M'
          docker compose exec -T nginx nginx -T 2>/dev/null | grep -q 'client_max_body_size 530m'
      - name: Sao lưu pg_dump thật từ container queue (tài khoản sao lưu riêng), rồi khôi phục thử
        run: |
          docker compose exec -T queue php artisan agrihub:backup:platform
          docker compose exec -T queue php artisan agrihub:backup:verify
          docker compose exec -T queue php artisan agrihub:backup:check --no-notify
      - name: Web (không có mật khẩu sao lưu) không tự sao lưu được
        run: |
          if docker compose exec -T app php artisan agrihub:backup:platform; then
            echo "Tiến trình web không được phép chạy sao lưu toàn hệ thống" >&2
            exit 1
          fi
      - name: Lịch chạy có đủ các lệnh sao lưu và thông báo
        run: |
          list=$(docker compose exec -T scheduler php artisan schedule:list)
          echo "$list"
          for cmd in backup:platform backup:tenants backup:prune backup:verify backup:check notices:prune monitor:beat monitor:ping monitor:check; do echo "$list" | grep -q "agrihub:$cmd"; done
      - name: Scheduler và queue worker gửi tín hiệu sống (giám sát hạ tầng)
        run: |
          for i in $(seq 1 30); do
            out=$(docker compose exec -T queue php artisan agrihub:monitor:check --no-notify || true)
            if echo "$out" | grep -q '\[ok\] scheduler' && echo "$out" | grep -q '\[ok\] queue_worker' && echo "$out" | grep -q '\[ok\] rls'; then echo "$out"; exit 0; fi
            sleep 10
          done
          echo "$out"
          exit 1
      - name: Nhật ký container khi lỗi
        if: failure()
        run: docker compose logs --no-color --tail=150

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
