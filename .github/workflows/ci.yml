name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Tài khoản quản trị của container (superuser => bỏ qua RLS) CHỈ dùng để tạo role ứng dụng bên dưới.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: agrihub_test
      DB_USERNAME: agrihub
      DB_PASSWORD: ci_only_password
      # Tài khoản sao lưu RIÊNG (BYPASSRLS + CREATEDB, không phải superuser) để kiểm thử sao lưu toàn hệ thống bằng pg_dump.
      BACKUP_DB_USERNAME: agrihub_backup
      BACKUP_DB_PASSWORD: ci_backup_password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, bcmath, zip, sodium, zlib
          coverage: none
      - name: Tạo role ứng dụng KHÔNG phải superuser (để Row-Level Security có hiệu lực)
        working-directory: .
        env:
          PGPASSWORD: ci_admin_password
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE agrihub LOGIN PASSWORD 'ci_only_password' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE DATABASE agrihub_test OWNER agrihub" \
            -c "CREATE ROLE agrihub_backup LOGIN PASSWORD 'ci_backup_password' NOSUPERUSER CREATEDB BYPASSRLS" \
            -c "GRANT pg_read_all_data TO agrihub_backup" \
            -c "GRANT agrihub TO agrihub_backup"
      - name: Dùng pg_dump / pg_restore ĐÚNG phiên bản máy chủ (lấy từ chính image postgres:16-alpine)
        # Client của runner (ubuntu-latest) đổi phiên bản theo bản Ubuntu và pg_dump mới hơn máy chủ tạo ra bản dump mà máy chủ cũ
        # không nạp được. Hai script nhỏ chạy công cụ trong container cùng image với service postgres (mạng host => 127.0.0.1:5432).
        working-directory: .
        run: |
          bin="$RUNNER_TEMP/pgbin"
          mkdir -p "$bin"
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host -e PGPASSWORD -e PGCONNECT_TIMEOUT -e PGSSLMODE postgres:16-alpine %s "$@"\n' "$tool" > "$bin/$tool"
            chmod +x "$bin/$tool"
          done
          echo "BACKUP_PG_BIN=$bin" >> "$GITHUB_ENV"
          "$bin/pg_dump" --version
          "$bin/pg_restore" --version
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
