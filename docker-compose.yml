# Môi trường DEVELOPMENT. Staging/Production có cấu hình riêng (xem docs/DEPLOYMENT.md).
# Mật khẩu mặc định bên dưới chỉ dùng cho máy dev; đặt giá trị riêng trong file .env ở thư mục gốc.
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build: ./docker/backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-agrihub}
      DB_USERNAME: ${POSTGRES_USER:-agrihub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-agrihub_dev_only}
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    build: ./docker/backend
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-agrihub}
      DB_USERNAME: ${POSTGRES_USER:-agrihub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-agrihub_dev_only}
      REDIS_HOST: redis
      BACKUP_DB_USERNAME: ${BACKUP_DB_USER:-agrihub_backup}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-agrihub_backup_dev_only}
    depends_on:
      - app

  scheduler:
    build: ./docker/backend
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-agrihub}
      DB_USERNAME: ${POSTGRES_USER:-agrihub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-agrihub_dev_only}
      REDIS_HOST: redis
      BACKUP_DB_USERNAME: ${BACKUP_DB_USER:-agrihub_backup}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-agrihub_backup_dev_only}
    depends_on:
      - app

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_PROXY: http://nginx:80

  postgres:
    image: postgres:16-alpine
    environment:
      # Superuser của container: chỉ để quản trị, ứng dụng KHÔNG dùng (sẽ bỏ qua RLS).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-agrihub_admin_dev_only}
      # Role ứng dụng thường, được tạo bởi docker/postgres/init-app-role.sh
      APP_DB_NAME: ${POSTGRES_DB:-agrihub}
      APP_DB_USER: ${POSTGRES_USER:-agrihub}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-agrihub_dev_only}
      # Tài khoản sao lưu toàn hệ thống (BYPASSRLS, CREATEDB): chỉ queue + scheduler dùng.
      BACKUP_DB_USER: ${BACKUP_DB_USER:-agrihub_backup}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-agrihub_backup_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
